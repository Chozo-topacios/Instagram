<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel animado</title>
<style>
  :root{--bg:#070b16;color-scheme:dark}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070b16}}
  :root[data-theme="dark"]{--bg:#070b16}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;font-family:Inter,"Inter Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1080px;height:1920px;flex:none;overflow:hidden;color:var(--ink);
    background:radial-gradient(1200px 900px at 50% 30%,var(--bg2),var(--bg) 70%)}
  body.render #stage{transform:none!important}
  .mono{font-family:"DejaVu Sans Mono",ui-monospace,Menlo,monospace}
  /* fondos */
  .bg{position:absolute;inset:-200px;pointer-events:none}
  .bg-grid{background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:90px 90px;opacity:.55}
  .bg-dots{background-image:radial-gradient(var(--line) 3px,transparent 3.5px);background-size:46px 46px}
  .bg-blobs{inset:0}
  .bg-blobs i{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(120px);opacity:.45}
  .bg-terminal{background:repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 8px);opacity:.35}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 2px,transparent 2px 6px);pointer-events:none}
  .vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,var(--vign));pointer-events:none}
  .tint{position:absolute;inset:0;pointer-events:none}
  /* cabecera */
  #prog{position:absolute;top:70px;left:70px;right:70px;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peligro),var(--acento))}
  #top{position:absolute;top:110px;left:70px;right:70px;display:flex;align-items:center;gap:22px}
  .badge{display:flex;align-items:center;gap:16px;padding:16px 28px;border-radius:999px;font-weight:800;font-size:32px;letter-spacing:3px;text-transform:uppercase}
  .badge .dot{width:22px;height:22px;border-radius:50%}
  #date{margin-left:auto;font-size:30px;font-weight:700;color:var(--mute);letter-spacing:2px}
  /* escenas */
  .scene{position:absolute;left:0;right:0;top:230px;height:1000px;opacity:0;visibility:hidden}
  .col{position:absolute;left:60px;right:60px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center}
  .h1{font-weight:900;font-size:100px;line-height:1.03;letter-spacing:-2px}
  .h2{font-weight:800;font-size:62px;line-height:1.12}
  .sub{font-size:42px;color:var(--mute);font-weight:650;line-height:1.25}
  .hl{color:var(--m)}
  .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:22px}
  .pill{display:inline-flex;align-items:center;gap:14px;padding:20px 34px;border-radius:24px;background:var(--panel);border:3px solid var(--line);font-size:50px;font-weight:800}
  .card{background:var(--panel);border:3px solid var(--line);border-radius:32px}
  .ico{width:340px;height:340px}
  .ico svg{width:100%;height:100%}
  /* subtítulos */
  #cap{position:absolute;left:80px;right:150px;top:1250px;min-height:200px;display:flex;align-items:flex-start;justify-content:center}
  #capbox{font-weight:800;text-align:center}
  .cap-caja #capbox{background:var(--capbg);border:3px solid var(--line);border-radius:30px;padding:26px 36px;font-size:54px;line-height:1.22;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .cap-karaoke #capbox{font-size:70px;line-height:1.15;font-weight:900;text-transform:uppercase;letter-spacing:-1px;
     -webkit-text-stroke:3px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.55)}
  .cap-karaoke #capbox .w{color:#fff}
  .cap-barra #cap{left:0;right:0}
  .cap-barra #capbox{width:100%;text-align:left;background:var(--capbg);border-left:16px solid var(--m-cur);padding:28px 150px 28px 60px;font-size:50px;line-height:1.24}
  #capbox .w{opacity:.35}
  #capbox .w.on{opacity:1}
  #capbox .w.now{color:var(--hl)}
  .cap-karaoke #capbox .w.now{color:var(--hl)}
  #handle{position:absolute;top:1060px;left:0;right:0;text-align:center;font-size:34px;color:var(--mute);font-weight:700;opacity:0}
  #ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:10;font:600 15px system-ui}
  #ui button{background:#ffd23f;color:#111;border:0;border-radius:999px;padding:12px 20px;font:inherit;cursor:pointer}
  #ui span{background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:12px 16px}
  body.render #ui{display:none}
</style>
</head>

  expr = expr || "neutral"; o = o || {};
  const id = "v" + Math.random().toString(36).slice(2, 7);
  const C = o.cian || "#00e5ff", V = o.violeta || "#8b6bff", M = o.magenta || "#ff2e88", R = "#ff3b5c";
  const alert = expr === "alerta" || expr === "sorpresa";
  const visorC = alert ? R : V, coreC = alert ? R : "#2ee59d";
  const blink = o.parpadeo ? `transform="translate(0 ${295 * (1 - o.parpadeo)}) scale(1 ${o.parpadeo})"` : "";
  const eye = (x, kind) => {
    if (kind === "feliz") return `<path d="M${x - 34} 312 q34 -46 68 0" fill="none" stroke="#eaffff" stroke-width="20" stroke-linecap="round"/>`;
    if (kind === "alerta") return `<circle cx="${x}" cy="296" r="40" fill="#eaffff"/><circle cx="${x}" cy="296" r="16" fill="#0a0f2a"/>`;
    if (kind === "sorpresa") return `<circle cx="${x}" cy="296" r="38" fill="none" stroke="#eaffff" stroke-width="14"/><circle cx="${x}" cy="296" r="10" fill="#eaffff"/>`;
    if (kind === "sospecha") return `<rect x="${x - 30}" y="292" width="60" height="34" rx="16" fill="#eaffff"/><path d="M${x - 40} ${x < 300 ? 280 : 292} L${x + 40} ${x < 300 ? 292 : 280}" stroke="#0a0f2a" stroke-width="16" stroke-linecap="round"/>`;
    return `<g ${blink}><rect x="${x - 28}" y="262" width="56" height="68" rx="26" fill="#eaffff"/><circle cx="${x - 10}" cy="282" r="9" fill="#fff"/></g>`;
  };
  const eyes = { neutral: ["n", "n"], feliz: ["feliz", "feliz"], alerta: ["alerta", "alerta"], guino: ["feliz", "n"], sospecha: ["sospecha", "sospecha"], sorpresa: ["sorpresa", "sorpresa"] }[expr] || ["n", "n"];
  const mouth = {
    neutral: `<path d="M272 402 q28 20 56 0" fill="none" stroke="#eaffff" stroke-width="10" stroke-linecap="round"/>`,

    sospecha: `<path d="M276 410 H326" stroke="#eaffff" stroke-width="10" stroke-linecap="round"/>`
  }[expr] || "";
  const cheeks = (expr === "feliz" || expr === "guino") ? `<circle cx="178" cy="392" r="22" fill="${M}" opacity=".45"/><circle cx="422" cy="392" r="22" fill="${M}" opacity=".45"/>` : "";

  const armL = `<path d="M118 440 Q70 470 66 520" fill="none" stroke="${C}" stroke-width="26" stroke-linecap="round" opacity=".9"/>`;
  let armR = `<path d="M482 440 Q530 470 534 520" fill="none" stroke="${C}" stroke-width="26" stroke-linecap="round" opacity=".9"/>`;
  if (alert) armR = `<path d="M482 420 Q540 360 548 270" fill="none" stroke="${C}" stroke-width="26" stroke-linecap="round" opacity=".9"/><circle cx="548" cy="262" r="20" fill="${C}"/>`;
  if (expr === "feliz" || expr === "guino") armR = `<path d="M482 430 Q548 420 556 350" fill="none" stroke="${C}" stroke-width="26" stroke-linecap="round" opacity=".9"/><rect x="536" y="300" width="40" height="52" rx="18" fill="${C}"/><rect x="548" y="270" width="18" height="40" rx="9" fill="${C}"/>`;
  return `
  <defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C}" stop-opacity=".42"/><stop offset=".6" stop-color="${V}" stop-opacity=".22"/><stop offset="1" stop-color="${V}" stop-opacity=".38"/></linearGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="${id}f" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="300" cy="668" rx="150" ry="20" fill="#000" opacity=".35"/>
  <!-- antena con la grieta (la "brecha") -->
  <path d="M300 146 V96" stroke="${C}" stroke-width="12" stroke-linecap="round"/>
  <path d="M284 30 L312 58 L292 64 L318 98" fill="none" stroke="${M}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#${id}f)"/>
  ${armL}${armR}
  <!-- pies -->
  <ellipse cx="236" cy="640" rx="44" ry="22" fill="${C}" opacity=".85"/><ellipse cx="364" cy="640" rx="44" ry="22" fill="${C}" opacity=".85"/>
  <!-- cuerpo de cristal -->

    <path d="M170 470 H220 L245 495 V560"/><path d="M430 470 H380 L355 495 V560"/><path d="M300 560 V600"/><path d="M150 420 H190"/><path d="M450 420 H410"/></g>
  <g fill="${C}" opacity=".7"><circle cx="245" cy="560" r="7"/><circle cx="355" cy="560" r="7"/><circle cx="300" cy="600" r="7"/></g>
  <!-- núcleo escudo -->
  <g transform="translate(300 512)" filter="url(#${id}f)"><path d="M0 -40 L36 -27 V2 C36 26 20 40 0 48 C-20 40 -36 26 -36 2 V-27 Z" fill="${coreC}" opacity=".95"/>
    ${alert ? `<rect x="-5" y="-26" width="10" height="34" rx="5" fill="#0a0f2a"/><circle cx="0" cy="22" r="6" fill="#0a0f2a"/>` : `<path d="M-15 4 L-4 15 L17 -9" fill="none" stroke="#0a0f2a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`}</g>
  <!-- brillo del cristal -->
  <path d="M190 200 C230 168 280 158 320 160 C250 180 210 220 186 280 C176 250 176 222 190 200 Z" fill="url(#${id}g)"/>
  ${cheeks}
  <!-- visor -->
  <rect x="148" y="228" width="304" height="136" rx="68" fill="#0a0f2a" stroke="${visorC}" stroke-width="8" filter="url(#${id}f)"/>
  <rect x="166" y="244" width="268" height="18" rx="9" fill="#fff" opacity=".08"/>
  <g filter="url(#${id}f)">${eye(232, eyes[0])}${eye(368, eyes[1])}</g>
  ${mouth}
  ${alert ? `<g filter="url(#${id}f)"><path d="M86 210 l-30 -26 M70 262 l-40 -6 M108 170 l-14 -36" stroke="${R}" stroke-width="10" stroke-linecap="round"/></g>` : ""}`;
}
if (typeof module !== "undefined") module.exports = { visi };

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

   const sh=el.querySelector(".sh"),ck=el.querySelector(".ck"),gl=el.querySelector(".gl"),a=el.querySelector(".a"),b=el.querySelector(".b");
   return tt=>{const s=eb(p(tt,S.start,S.start+.5));sh.setAttribute("transform",`translate(310 310) scale(${.6+.4*s}) translate(-310 -310)`);
     ck.setAttribute("stroke-dashoffset",320*(1-eo(p(tt,S.start+.4,S.start+1))));gl.setAttribute("r",240+20*Math.sin(tt*3));
     a.style.opacity=p(tt,S.start+.1,S.start+.4);
     if(b){const tb=S.lines[1]?S.lines[1].start-.1:S.start+1.2;b.style.opacity=p(tt,tb,tb+.3);b.style.transform=`scale(${.85+.15*eb(p(tt,tb,tb+.4))})`;}};
 },
 personaje(el,sc,S,m){
   /* Visi habla: globo de texto + mascota. expresiones[] cambia por línea; textos[] cambia el globo por línea */
   const tx=sc.textos||[sc.texto||""];
   el.innerHTML=`<div class="col" style="gap:10px">
     <div class="card bub" style="position:relative;padding:34px 44px;max-width:900px;border-color:${m};background:var(--panel)">
       <div class="h2 bt" style="font-size:${sc.tam||64}px">${md(tx[0])}</div>
       <div style="position:absolute;left:50%;bottom:-34px;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:34px solid ${m};transform:translateX(-50%)"></div></div>
     <svg class="vs" viewBox="0 0 600 700" width="${sc.tam_personaje||560}" height="${(sc.tam_personaje||560)*7/6}"></svg></div>`;
   const vs=el.querySelector(".vs"),bub=el.querySelector(".bub"),bt=el.querySelector(".bt");let last="",lastT=-1;
   return tt=>{
     let li=0;S.lines.forEach((l,i)=>{if(tt>=l.start-.15)li=i;});
     const ex=(sc.expresiones&&sc.expresiones[Math.min(li,sc.expresiones.length-1)])||sc.expresion||"neutral";
     const ph=(tt*1.3)%3.2;const bl=ph<.12?Math.max(.1,Math.abs(1-ph/.06)):1;
     const key=ex+"|"+bl.toFixed(2);
     if(key!==last){last=key;vs.innerHTML=visi(ex,{parpadeo:bl<1?bl:0});}
     const k=eb(p(tt,S.start,S.start+.5));
     vs.style.transform=`translateY(${(1-k)*300+Math.sin(tt*3)*12}px) rotate(${Math.sin(tt*2)*3}deg)`;vs.style.opacity=clamp(k*2);
     const ti=Math.min(li,tx.length-1);if(ti!==lastT){lastT=ti;bt.innerHTML=md(tx[ti]);}
     const a=S.lines[ti]?S.lines[ti].start-.2:S.start+.2;const q=eb(p(tt,a,a+.35));
     bub.style.transform=`scale(${.6+.4*q})`;bub.style.opacity=clamp(q*1.5);};
 },
 cta(el,sc,S,m){
   const ic=sc.iconos||["guardar","compartir"];const cols=[TH.acento,TH.neutral,TH.calma];
   el.innerHTML=`<div class="col" style="gap:40px;padding-top:40px">
     <div style="display:flex;gap:${sc.mascota?40:90}px;justify-content:center;align-items:flex-end">${sc.mascota?`<svg class="ci" viewBox="0 0 600 700" width="260" height="303">${visi(sc.mascota)}</svg>`:""}${ic.map((n,i)=>`<div class="ci">${ico(n,cols[i%3],sc.mascota?170:(ic.length>2?200:260))}</div>`).join("")}</div>
     <div class="h1" style="font-size:${sc.tam||104}px">${md(sc.texto||"*Guárdalo* y compártelo")}</div>
     ${sc.sub?`<div class="h2" style="font-size:48px;color:var(--mute)">${md(sc.sub)}</div>`:""}</div>`;
   const ci=[...el.querySelectorAll(".ci")];
   return tt=>ci.forEach((e,i)=>{const q=eb(p(tt,S.start+i*.3,S.start+.45+i*.3));e.style.transform=`scale(${q}) translateY(${Math.sin(tt*5+i)*8}px)`;});
 }
};

/* ---------- construir ---------- */
const host=$("scenes");
const R=scenesSpec.map((sc,i)=>{
  const el=document.createElement("section");el.className="scene";host.appendChild(el);
  const m=MODE(sc.modo||"neutral");el.style.setProperty("--m",m);
  const fn=(BUILD[sc.tipo]||BUILD.titular)(el,sc,W[i],m);
  return {el,fn,sc,m};
});

/* palabras de subtítulos */
T.lines.forEach(l=>{const ws=l.text.split(/\s+/);const tot=ws.reduce((s,w)=>s+w.length+1,0);let acc=0;
  l.words=ws.map(w=>{const st=l.start+(acc/tot)*(l.end-l.start);acc+=w.length+1;return {w,st};});});
let capIdx=-1;
function caption(t){
  let idx=-1;for(let i=0;i<T.lines.length;i++){const l=T.lines[i],nx=T.lines[i+1];if(t>=l.start-.12&&t<(nx?nx.start-.12:l.end+.8))idx=i;}
  const box=$("capbox");
  if(idx!==capIdx){capIdx=idx;box.innerHTML=idx<0?"":T.lines[idx].words.map(o=>`<span class="w">${esc(o.w)}</span>`).join(" ");}
  box.style.opacity=idx<0?0:1;if(idx<0)return;
  const L=T.lines[idx],ws=box.children;
  L.words.forEach((o,i)=>{const nx=L.words[i+1];ws[i].classList.toggle("on",t>=o.st);ws[i].classList.toggle("now",t>=o.st&&t<(nx?nx.st:L.end));});
  box.style.transform=`scale(${.92+.08*eb(p(t,L.start-.12,L.start+.15))})`;
}

const TR=SPEC.transicion||"fade";
function trans(el,t,S,i){
  const a=Math.min(p(t,S.start,S.start+.3),1-p(t,S.end-.25,S.end));
  el.style.opacity=a;el.style.visibility=a>.001?"visible":"hidden";
  const kin=1-eo(p(t,S.start,S.start+.4)),kout=p(t,S.end-.25,S.end);
  const drift=1+.025*p(t,S.start,S.end);
  let tf=`scale(${drift})`,flt="none";
  if(TR==="slide")tf=`translateX(${kin*(i%2?-1:1)*260-kout*(i%2?-1:1)*200}px) scale(${drift})`;
  if(TR==="zoom")tf=`scale(${drift*(1+.18*kin-.08*kout)})`;
  if(TR==="glitch"){const g=p(t,S.start,S.start+.28)<1?1:0;const j=g?Math.sin(t*90)*14:0;tf=`translateX(${j}px) scale(${drift})`;flt=g?`drop-shadow(${j}px 0 0 ${TH.peligro}) drop-shadow(${-j}px 0 0 ${TH.neutral})`:"none";}
  el.style.transform=tf;el.style.filter=flt;
}

function curScene(t){let c=0;W.forEach((S,i)=>{if(t>=S.start)c=i;});return c;}
function render(t){
  $("progi").style.width=(clamp(t/T.duration)*100)+"%";
  if(TH.fondo==="grid"||TH.fondo==="terminal")$("bg").style.transform=`translateY(${(t*30)%90}px)`;
  if(TH.fondo==="dots")$("bg").style.transform=`translate(${(t*12)%46}px,${(t*12)%46}px)`;
  if(TH.fondo==="blobs")[...$("bg").children].forEach((b,i)=>b.style.transform=`translate(${Math.sin(t*.4+i*2)*160}px,${Math.cos(t*.3+i)*140}px)`);
  const ci=curScene(t),cs=R[ci];const m=cs.m;
  ST.style.setProperty("--m-cur",m);
  $("badge").style.background=m+"26";$("badge").style.color=m;$("bdot").style.background=m;
  $("bdot").style.opacity=.5+.5*Math.abs(Math.sin(t*4));
  $("btxt").textContent=cs.sc.insignia||SPEC.insignia||"Ciberseguridad";
  const danger=(cs.sc.modo==="peligro");
  $("tint").style.background=`radial-gradient(circle at 50% 40%, ${m}${danger?Math.round((.12+.06*Math.sin(t*6))*255).toString(16).padStart(2,"0"):"1a"}, transparent 60%)`;
  $("handle").style.opacity=cs.sc.tipo==="cta"?.95:0;
  R.forEach((r,i)=>{trans(r.el,t,W[i],i);if(t>=W[i].start-.05&&t<=W[i].end+.05)r.fn(t);});
  caption(t);
}

function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);ST.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();
if(new URLSearchParams(location.search).has("render")){document.body.classList.add("render");window.seek=render;render(0);}
else{const aud=$("aud");let playing=false,start=0;
  function loop(){const t=!aud.paused&&aud.duration?aud.currentTime:(performance.now()-start)/1000;render(t);$("clock").textContent=t.toFixed(1)+"s";
    if(t>=T.duration){playing=false;$("play").textContent="↺ Repetir";return;}if(playing)requestAnimationFrame(loop);}
  $("play").onclick=()=>{aud.currentTime=0;start=performance.now();playing=true;$("play").textContent="Reproduciendo…";aud.play().catch(()=>{});loop();};
  render(Math.min(1,T.duration));}
</script>
</body>
