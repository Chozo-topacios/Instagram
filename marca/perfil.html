<!doctype html><html><head><meta charset="utf-8"><title>Foto de perfil</title>
<style>*{margin:0}body{background:#000}.v{width:1080px;height:1080px;position:relative;overflow:hidden}</style></head><body>
<!-- A · NOCHE: escudo con alerta -->
<div class="v" id="a" style="background:radial-gradient(circle at 50% 42%,#16244d 0%,#070b16 68%)">
<svg viewBox="0 0 1080 1080" width="1080" height="1080">
 <defs>
  <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ad4ff"/><stop offset="1" stop-color="#2ee59d"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#3ad4ff" stroke-opacity=".08" stroke-width="2"/></pattern>
 </defs>
 <rect width="1080" height="1080" fill="url(#grid)"/>
 <circle cx="540" cy="540" r="330" fill="#ff3b5c" opacity=".10"/>
<g transform="translate(540 530) scale(1.15) translate(-540 -530)">
 <path d="M540 200 L790 290 V500 C790 680 680 800 540 860 C400 800 290 680 290 500 V290 Z" fill="#0b1226" stroke="url(#ga)" stroke-width="34" stroke-linejoin="round" filter="url(#glow)"/>
 <rect x="510" y="360" width="60" height="250" rx="28" fill="#ff3b5c" filter="url(#glow)"/>
 <circle cx="540" cy="690" r="38" fill="#ff3b5c" filter="url(#glow)"/>
</g>
</svg></div>
<!-- B · NEON: candado-escudo -->
<div class="v" id="b" style="background:radial-gradient(circle at 30% 25%,#ff2e88 0%,transparent 45%),radial-gradient(circle at 75% 80%,#00e5ff 0%,transparent 45%),#16062a">
<svg viewBox="0 0 1080 1080" width="1080" height="1080">
 <defs><filter id="gb"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <circle cx="540" cy="540" r="360" fill="#0d0418" opacity=".55"/>
 <path d="M410 470 V390 a130 130 0 0 1 260 0 V470" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" filter="url(#gb)"/>
 <rect x="330" y="460" width="420" height="340" rx="70" fill="#fff" filter="url(#gb)"/>
 <path d="M540 545 L540 640" stroke="#ff2e88" stroke-width="56" stroke-linecap="round"/>
 <circle cx="540" cy="700" r="30" fill="#ff2e88"/>
</svg></div>
<!-- C · TERMINAL: ojo vigilante -->
<div class="v" id="c" style="background:radial-gradient(circle at 50% 50%,#06210f 0%,#010503 70%)">
<svg viewBox="0 0 1080 1080" width="1080" height="1080">
 <defs><filter id="gc"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="sl" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="3" fill="#39ff88" opacity=".06"/></pattern></defs>
 <rect width="1080" height="1080" fill="url(#sl)"/>
 <path d="M200 540 C330 330 750 330 880 540 C750 750 330 750 200 540 Z" fill="none" stroke="#39ff88" stroke-width="40" stroke-linejoin="round" filter="url(#gc)"/>
 <circle cx="540" cy="540" r="130" fill="#39ff88" filter="url(#gc)"/>
 <path d="M540 470 L540 560" stroke="#010503" stroke-width="34" stroke-linecap="round"/><circle cx="540" cy="605" r="19" fill="#010503"/>
</svg></div>
</body></html>
